# Render blueprint — one free web service running Omnigraph + the console.
# Deploy: push repo to GitHub → Render dashboard → New → Blueprint → pick repo.
# Set the secret env vars (marked sync:false) in the dashboard after it loads.
services:
  - type: web
    name: analytos-brain
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TOK_ADMIN
        sync: false
      - key: TOK_REVIEWER
        sync: false
      - key: TOK_INGEST
        sync: false
      - key: TOK_CONTENT
        sync: false
      - key: TOK_GTM
        sync: false
      - key: APP_USER
        value: reviewer
      - key: APP_PASSWORD
        sync: false
      - key: OMNIGRAPH_EMBED_PROVIDER
        value: mock
    # Free tier includes an ephemeral disk; graph data resets on redeploy/sleep.
    # For durability across restarts, upgrade this service and attach a disk at
    # /data (see the commented block below).
    # disk:
    #   name: omnigraph-data
    #   mountPath: /data
    #   sizeGB: 1
